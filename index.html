    <script type="module">
        // Prolog runs in a Web Worker (see app/PrologWorker.js), so a query that runs past the
        // time limit can be stopped by terminating the worker.
        const TREALLA_URL = 'https://esm.sh/trealla@0.30.0?target=es2022';
        const DEFAULT_TIME_LIMIT = 5; // seconds

        class TimeLimitError extends Error {
            constructor(seconds) {
                super("Time limit exceeded (" + seconds + " s)");
                this.name = "TimeLimitError";
                this.seconds = seconds;
            }
        }

        class StoppedError extends Error {
            constructor() {
                super("Query stopped");
                this.name = "StoppedError";
            }
        }

        // the time limit for running Prolog, in seconds - 0 means no limit
        function getTimeLimit() {
            const value = Number(window.Model && Model.settings ? Model.settings.timeLimit : undefined);
            return Number.isFinite(value) && value >= 0 ? value : DEFAULT_TIME_LIMIT;
        }

        class PrologEngine {
            constructor() {
                this.cachedExternalModuleURLs = []; // external modules that have been loaded into this engine
                this.pending = new Map();
                this.lastId = 0;
                this.stopped = false;

                const source = "(" + window.prologWorkerMain.toString() + ")(" + JSON.stringify(TREALLA_URL) + ");";
                this.workerUrl = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
                this.worker = new Worker(this.workerUrl, { type: "module" });
                this.worker.onmessage = (event) => this.onMessage(event.data);
                this.worker.onerror = (event) => {
                    event.preventDefault();
                    this.stop(new Error("Prolog worker failed: " + (event.message || "unknown error")));
                };

                this.ready = this.post("init", {}, 0);
            }

            onMessage({ id, ok, result, error }) {
                const request = this.pending.get(id);
                if (!request)
                    return;
                this.pending.delete(id);
                clearTimeout(request.timer);
                updateStopButton();
                if (ok)
                    request.resolve(result);
                else
                    request.reject(new Error(error));
            }

            post(type, payload, timeLimit, runsUserCode) {
                if (this.stopped)
                    return Promise.reject(new Error("The Prolog engine has been stopped"));
                const id = ++this.lastId;
                return new Promise((resolve, reject) => {
                    const request = { resolve, reject, timer: null, runsUserCode };
                    if (timeLimit > 0) {
                        request.timer = setTimeout(() => {
                            this.pending.delete(id);
                            this.stop(new Error("The Prolog engine was reset"));
                            reject(new TimeLimitError(timeLimit));
                        }, timeLimit * 1000);
                    }
                    this.pending.set(id, request);
                    updateStopButton();
                    this.worker.postMessage({ id, type, payload });
                });
            }

            // wait for the engine to start, then run a request - running user code gets the time limit
            async request(type, payload, runsUserCode) {
                await this.ready;
                return this.post(type, payload, runsUserCode ? getTimeLimit() : 0, runsUserCode);
            }

            // true while a query (or anything else that runs user code) is executing
            isRunningUserCode() {
                for (const request of this.pending.values())
                    if (request.runsUserCode)
                        return true;
                return false;
            }

            writeFile(path, text) { return this.request("writeFile", { path, text }, false); }
            consult(path) { return this.request("consult", { path }, true); }
            query(qid, goal, program) { return this.request("query", { qid, goal, program }, true); }
            next(qid) { return this.request("next", { qid }, true); }

            // kill the worker - fails every request that is still waiting for an answer
            stop(reason) {
                if (this.stopped)
                    return;
                this.stopped = true;
                this.worker.terminate();
                URL.revokeObjectURL(this.workerUrl);
                for (const request of this.pending.values()) {
                    clearTimeout(request.timer);
                    request.reject(reason);
                }
                this.pending.clear();
                updateStopButton();
            }
        }

        function updateStopButton() {
            const button = document.getElementById("stopButton");
            if (button)
                button.disabled = !(engine && !engine.stopped && engine.isRunningUserCode());
        }

        // the Stop button - kill the running query; the next query starts a fresh engine
        window.stopQuery = function() {
            if (engine && engine.isRunningUserCode())
                engine.stop(new StoppedError());
        };

        let engine = null;
        let prevSrc;     // the program that was last sent to the engine
        let queryId = 0;
        let activeQuery = null; // id of the query that "Next" asks for more answers from

        window.resetProlog = function() {
            if (engine)
                engine.stop(new Error("The Prolog engine was reset"));
            prevSrc = undefined;
            activeQuery = null;
            engine = new PrologEngine();
            return engine;
        };

        // report an error from running Prolog - a time limit also means the engine is gone,
        // so make sure the next query starts a new one and recompiles the model
        window.handlePrologError = function(error) {
            if (error instanceof TimeLimitError || error instanceof StoppedError) {
                const reason = error instanceof TimeLimitError ? error.message + " - the query was stopped" : "Query stopped";
                app.bottombar.addToConsole(reason + " and the Prolog engine reset\n");
                app.pl = null;
                prevSrc = undefined;
                activeQuery = null;
                app.bottombar.nextButton[0].disabled = true;
            } else {
                console.error(error);
                alert(error);
            }
        };

        async function runStep(step) {
            const started = Date.now();
            try {
                const answer = await step();
                app.bottombar.executionTimer.innerHTML = "execution-time: " + (Date.now() - started) + " ms";
                if (answer.done) {
                    activeQuery = null;
                    return false;
                }
                app.bottombar.addToConsole(answer.text + '\n');
                return true;
            } catch (error) {
                app.bottombar.executionTimer.innerHTML = "";
                handlePrologError(error);
                return false;
            }
        }

        window.runner = async function runner(query, code) {
            if (!engine)
                resetProlog();
            const program = code === prevSrc ? undefined : code;
            const qid = ++queryId;
            activeQuery = qid;
            await runStep(() => engine.query(qid, query, program));
            prevSrc = code;
        };

        window.nextAnswer = async function nextAnswer() {
            if (!engine || activeQuery == null)
                return;
            const qid = activeQuery;
            await runStep(() => engine.next(qid));
        };
    </script>

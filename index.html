        app = new praxis.Application();

                    console.log("Started loading example model");

                    app.setModel(model);

                }});

            }
        }

    <script type="module">
        import { load, Prolog, toJSON, FORMATS } from 'https://esm.sh/trealla@0.27.0?target=es2022';
        
        try {
            load().then(init);
        } catch(err) {
            alert(err);
        }
        
        let pl = null;
        
        function init() {
            try {
                pl = new Prolog();
                pl.cachedExternalModuleURLs = []; // to keep track of what external modules have actually been loaded into the prolog engine
                return pl;
            } catch(err) {
                alert(err);
                throw err;
            }           
        }
        
        window.consultPrologFile = async function (path){
            pl.consult("/" + cache.name + ".pl");
        }

                
        window.resetProlog = function() {
            prevSrc = undefined;
            return init();
        }
        
        window.runner = async function runner(query,code){
            const format = "prolog";
            const toplevel = format == "prolog" ? new Toplevel(1) : format;
    
            let n = 0;
            const encode = format == "prolog" ? {dot: false} : undefined;
            const q = pl.query(query, {program: code === prevSrc ? undefined : code, format: toplevel, encode: encode});
            QUERIES[1] = q;
        
            await next(1);
            prevSrc = code;
        }

        window.nextAnswer = async function nextAnswer(){
            await next(1);
        }

        window.testProlog = async function testProlog(){
            // test retrieval of prolog json format answers
            const pl = new Prolog();

            const result = await pl.queryOnce('User = {"id": 123,"name": "Alice","active": true,"tags": ["prolog", "logic"]}.',{ format: "prolog" });
            
            var res = result.substring(result.indexOf('{'),result.lastIndexOf('.'));
            var jsss = JSON.parse(res);

        }

        window.ask = async function ask() {
            try {
                await run();
            } catch(error) {
                alert(error);
                console.error(error);
            }
        }
        
        class Toplevel {
            id;
            dec;
            constructor(id) {
                this.id = id;
                this.dec = new TextDecoder();
            }
            query(_, goal, bind) {
                return FORMATS.prolog.query(null, goal, bind);
            }
            parse(pl, status, stdout, stderr, options) {
                return {
                    '$format': 'custom',
                    id: this.id,
                    status,
                    stdout: FORMATS.prolog.parse(pl, status, stdout, stderr, options),
                    stderr: this.dec.decode(stderr)
                };
            }
            truth(pl, status, stderr, options) {
                return {'$format': 'custom', id: this.id, status, stdout: status ? "true" : "false", stderr: this.dec.decode(stderr)};
            }
        }
        
        let ID = 0;
        let prevSrc;
        async function run() {
            const id = ++ID;
            //const query = "asserta(app(a)),findall(A,app(A),AS),length(AS,L)."; //getQuery();
            //const src = ":- dynamic app/1."; // document.getElementById("src").value;
            //const format = document.getElementById("format").value;

            pl.fs.open("/greeting.pl", { write: true, create: true }).writeString(`
  :- module(greeting, [hello/1]).
  hello(world).
  hello(w).
`);

// consult file
await pl.consult("/greeting.pl");

// use the file we added

//const query = pl.query("use_module(greeting), hello(X)");

            const format = "prolog";
            const toplevel = format == "prolog" ? new Toplevel(id) : format;
            //const src = "";
            /*const elem = document.getElementById("query-tmpl").content.cloneNode(true);
            const box = elem.querySelector(".query-box");
            box.id = `query-${id}`;
            box.dataset.id = id;
            box.dataset.format = format;
            elem.querySelector(".query-result").textContent = "?- " + query + "\n";
            elem.querySelector(".query-next").onmousedown = next.bind(elem, id);
            elem.querySelector(".query-all").onmousedown = all.bind(elem, id);
            elem.querySelector(".query-stop").onmousedown = stop.bind(elem, id);
            document.getElementById("queries").prepend(elem);
        */
            //let text = "?- " + query + "\n";
            let n = 0;
            const encode = format == "prolog" ? {dot: false} : undefined;
            const q = pl.query("hellow(I)", {program: ":-use_module(greeting). hellow(I):-hello(I).", format: toplevel, encode: encode});
            QUERIES[id] = q;
        
            await next(id);
            prevSrc = "src";
        }
        
        function getQuery() {
            return document.getElementById("query").value.replaceAll(`“`, `"`).replaceAll(`”`, `"`).replaceAll(`‘`, `'`).replaceAll(`’`, `'`);
        }
        
        const QUERIES = {};
        
        async function next(id) {
            //const elem = document.getElementById("query-" + id);
            //if (!elem) return;
            const ok = await redo(id, null);
            if (!ok) {
                //elem.dataset.state = "done";
            }
        }
        
        async function all(id) {
            const elem = document.getElementById("query-" + id);
            if (!elem) return;
            const limit = 10000;
            for (var i = 0; i <= limit && await redo(id, elem); i++) {};
            if (i > limit) {
                elem.querySelector(".query-result").textContent += `\n% paused after ${limit} results`
            } else {
                elem.dataset.state = "done";
            }
        }
        
        async function redo(id, elem) {
            const q = QUERIES[id];
            if (!q) return false;
            let result;
            try {
                console.time("query");
                result = (await q.next()).value;
            } catch(error) {
                alert(error);
                console.error(error);
                return false;
            } finally {
                console.timeEnd("query");
            }
            var res = ""; //const stdout = elem.querySelector(".query-result");
            if (!result) {
                delete QUERIES[id];
                //if (elem.dataset.format !== "json")
                    res += ".";
                return false;
            }
            const n = 0; //Number(elem.dataset.n ?? 0);
            if (typeof result === "string")
                res += (n > 0 ? "\n;  " : "   ") + result;
            else if ('$format' in result) {
                res += `${(n > 0 ? "\n" : "") + result.stderr.trim()}${(!!result.stderr ? "\n" : "") + (n > 0 ? ";  " : "   ") + result.stdout.trim()}`;
            } else {
                res += toJSON(result, " ") + "\n";
            }
            console.log(res);
            app.bottombar.addToConsole(res + '\n');
            //elem.dataset.n = n+1;
            return true;
        }
        
        function stop(id) {
            const elem = document.getElementById("query-" + id);
            if (!elem) return;
            const q = QUERIES[id];
            if (!q) return false;
            delete QUERIES[id];
            q.return();
            elem.querySelector(".query-result").textContent += ".\n% stopped"
            elem.dataset.state = "done";
        }
        
        window.updateURL = function() {
            const query = document.getElementById("query");
            const src = document.getElementById("src");
            const url = new URL(document.URL);
            if (src.value.length < 10 * 1024) {
                url.searchParams.set("src", src.value);
            } else {
                url.searchParams.delete("src");
            }
            url.searchParams.set("q", query.value);
            url.searchParams.set("v", "0");
            history.replaceState(query.value, "", url.toString());
        }
